name: CI Build
on:
  push:
    branches:
      - main
  schedule:
    # Daily at 00:05 UTC — promotes any drafts whose date has arrived.
    - cron: '5 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: www-docs-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: radiusred/tradedesk
          path: _sources/tradedesk
      - uses: actions/checkout@v6
        with:
          repository: radiusred/tradedesk-dukascopy
          path: _sources/tradedesk-dukascopy
      - uses: actions/checkout@v6
        with:
          repository: radiusred/tradedesk-miner
          path: _sources/tradedesk-miner
      - uses: actions/checkout@v6
        with:
          repository: radiusred/ha-sinkhole
          path: _sources/ha-sinkhole
      - uses: actions/checkout@v6
        with:
          repository: radiusred/gh-codecrew
          path: _sources/gh-codecrew
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: python3 sync_docs.py
        env:
          SYNC_SOURCE_BASE: _sources
      - run: python3 main.py
      - run: zensical build --clean
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.WWW_SSH_DEPLOY_KEY }}
          VPS_HOST_KEY: ${{ secrets.WWW_VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Use pinned secret if available; fall back to hardcoded bundle (host keys are public)
          if [ -n "$VPS_HOST_KEY" ]; then
            KNOWN_HOST="$VPS_HOST_KEY"
          else
            KNOWN_HOST=$(printf '%s\n%s\n%s\n' \
              '|1|dEeH7/T5zHJsemVhKXWmRwTg4Ak=|WfGlnOH4LnOpfUE4+zhTyC5CWkk= ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBIiKnth41f3o/89V9gteK7nwFIsk6apq7G8dv+l6Y8ZZT36RaUseSs5tqrWFR4JAW82E40J6uS3hb2xpPkYbT2w=' \
              '|1|UpxRr6UJl1dTmQ27BgAAzp9Igq4=|L1zCINQ4pv5I5BnRh2b2R+n7TeQ= ssh-rsa ' \
              '|1|wA+68ZK7lFkqIwXPborw0bXgRLQ=|xFl4Vqo0wPqIO40pmh1/cIyYR3g= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINmzAItYy5vhhXcPy9rSnzhVIvTA7lmdSWWVEPGqtiyF')
          fi
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          echo "::group::SSH key diagnostic (RAD-3475)"
          echo "id_ed25519 byte size:"
          wc -c < ~/.ssh/id_ed25519 || true
          echo "id_ed25519 fingerprint (safe to log — public-key hash, not key material):"
          ssh-keygen -y -f ~/.ssh/id_ed25519 2>&1 | ssh-keygen -lf - 2>&1 || echo "could not derive public key"
          echo "::endgroup::"
      - name: Deploy to nginx VPS
        run: |
          rsync -av --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -v -o IdentitiesOnly=yes" \
            site/ live@129.121.91.205:/var/www/www.radiusred.uk/
