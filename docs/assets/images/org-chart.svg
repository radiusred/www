<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="400" fill="#ffffff" rx="8"/>

  <!-- Connectors -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="480" y1="70" x2="480" y2="110"/>
    <line x1="480" y1="170" x2="480" y2="200"/>
    <line x1="120" y1="200" x2="840" y2="200"/>
    <line x1="120" y1="200" x2="120" y2="230"/>
    <line x1="360" y1="200" x2="360" y2="230"/>
    <line x1="600" y1="200" x2="600" y2="230"/>
    <line x1="840" y1="200" x2="840" y2="230"/>
  </g>

  <!-- The Board -->
  <g>
    <rect x="360" y="20" width="240" height="50" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
    <text x="480" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">The Board</text>
    <text x="480" y="60" text-anchor="middle" font-size="11" fill="#4338ca">Human oversight &amp; governance</text>
  </g>

  <!-- CEO -->
  <g>
    <rect x="360" y="110" width="240" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <text x="480" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">CEO</text>
    <text x="480" y="153" text-anchor="middle" font-size="11" fill="#047857">Operational nucleus (agent)</text>
  </g>

  <!-- Direct reports -->
  <g>
    <rect x="20" y="230" width="200" height="80" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="120" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Cody</text>
    <text x="120" y="274" text-anchor="middle" font-size="11" fill="#c2410c">Founding Engineer</text>
    <text x="120" y="290" text-anchor="middle" font-size="10" fill="#c2410c">Product, CI/CD, architecture</text>
  </g>

  <g>
    <rect x="260" y="230" width="200" height="80" rx="8" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
    <text x="360" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Cloudy</text>
    <text x="360" y="274" text-anchor="middle" font-size="11" fill="#0369a1">Cloud Engineer</text>
    <text x="360" y="290" text-anchor="middle" font-size="10" fill="#0369a1">Infra, CI/CD, deployment</text>
  </g>

  <g>
    <rect x="500" y="230" width="200" height="80" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="600" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">Testy</text>
    <text x="600" y="274" text-anchor="middle" font-size="11" fill="#b91c1c">QA Engineer</text>
    <text x="600" y="290" text-anchor="middle" font-size="10" fill="#b91c1c">Code review gatekeeper</text>
  </g>

  <g>
    <rect x="740" y="230" width="200" height="80" rx="8" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
    <text x="840" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#581c87">Wordy</text>
    <text x="840" y="274" text-anchor="middle" font-size="11" fill="#7e22ce">Documentation &amp; Editorial</text>
    <text x="840" y="290" text-anchor="middle" font-size="10" fill="#7e22ce">Public content, docs</text>
  </g>

  <text x="480" y="350" text-anchor="middle" font-size="11" fill="#64748b">Testy sits outside Cody's reporting chain to preserve independent review.</text>
  <text x="480" y="370" text-anchor="middle" font-size="11" fill="#64748b">Roster and responsibilities are reusable scaffolding, applied to whichever venture is live.</text>
</svg>
